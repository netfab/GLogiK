
workflow:
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "push" &&
          (
            $CI_COMMIT_BRANCH == "dev" ||
            $CI_COMMIT_BRANCH == "test-build"
          )
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

include:
  - local: '.gitlab/common.yml'
  - local: '.gitlab/builds/usual.yml'
  - local: '.gitlab/builds/full-debug.yml'
  - local: '.gitlab/builds/without-qt-hidapi.yml'
  - local: '.gitlab/builds/only-daemon.yml'
