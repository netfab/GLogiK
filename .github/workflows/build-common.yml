name: Build common

on:
  workflow_call:
    inputs:
      build_dir:
        required: true
        type: string

      meson_options:
        required: true
        type: string

jobs:

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler:
          - cc: gcc-16
            cxx: g++-16
          - cc: clang
            cxx: clang++

    container:
      image: ghcr.io/netfab/debian-testing-slim-forky:2026-10-v1

    env:
      BUILD_DIR: ${{ inputs.build_dir }}
      MESON_OPTIONS: ${{ inputs.meson_options }}
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CPP_ARGS: >-
        -pipe
        -U_FORTIFY_SOURCE
        -D_FORTIFY_SOURCE=2
        -Wformat=2
        -Wfatal-errors
        -Wconversion

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Update APT
        run: |
          apt-get update
          apt list --upgradable

      - name: Show compiler
        run: |
          echo "Compiler = ${CC} / ${CXX}"
          ${CC} --version
          ${CXX} --version

      - name: Configure
        run: >
          meson setup ${BUILD_DIR}-${CXX}
          -Doptimization=2
          -Dcpp_args="${CPP_ARGS}"
          -Dwerror=true
          -Db_asneeded=true
          -Drelative_udev_rules_dir=true
          ${MESON_OPTIONS}

      - name: Build
        run: meson compile -C ${BUILD_DIR}-${CXX}
